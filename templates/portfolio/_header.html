<header class="sticky top-0 z-40 border-b border-white/10 bg-graphite/80 backdrop-blur-xl">

        </a>

        <div class="hidden items-center gap-7 font-mono text-xs uppercase tracking-[.16em] text-smoke/70 lg:flex">
